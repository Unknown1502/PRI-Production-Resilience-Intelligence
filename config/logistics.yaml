# Minutes before crew call that cast are picked up and brought to set. Real
# call sheets carry these per person; one production-wide figure is enough for
# the demo and keeps the fixture honest about what it does not model.
cast_timings:
  pickup_minutes_before_call: 60
  on_set_minutes_after_call: 30
