name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    # The persistence, transition and API suites are transactional guarantees.
    # A fake repository would happily "roll back" a write it never made, so CI
    # runs them against a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pri_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: pri
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pri_user -d pri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install librdkafka
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure environment
        # Placeholder credentials only. Anything that needs a real cloud
        # credential is marked `integration` and skipped below, not failed.
        run: |
          cp .env.example .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://pri_user:changeme@localhost:5432/pri|' .env
          sed -i 's|^GOOGLE_APPLICATION_CREDENTIALS=.*|GOOGLE_APPLICATION_CREDENTIALS=|' .env
          sed -i 's|^PRI_API_KEY=.*|PRI_API_KEY=ci-key|' .env
          echo "GIT_SHA=${GITHUB_SHA::7}" >> .env

      - name: ruff check
        run: ruff check src tests scripts

      - name: ruff format
        run: ruff format --check src tests scripts

      - name: mypy (strict on domain + engine)
        run: mypy src/pri

      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pri_user:changeme@localhost:5432/pri
        run: pytest -q -m "not integration" --tb=short

      - name: The demo scenario, named
        # Printed separately so a reviewer can see the six non-negotiable
        # assertions pass without reading the whole log.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pri_user:changeme@localhost:5432/pri
        run: pytest tests/engine/simulation/test_recovery_scenario.py -v --tb=short

  frontend:
    name: frontend (tsc, eslint, next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  compliance:
    name: compliance (no forbidden AI SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No non-Google AI SDK anywhere in the source
        # The contest rules prohibit all non-Google AI tooling. This is cheaper
        # to enforce in CI than to discover during judging.
        #
        # This step matched any occurrence of a forbidden name on any line,
        # which meant `src/pri/agent/__init__.py` failed it — that file's
        # docstring *states* the package uses no LangChain, OpenAI or
        # Anthropic, and saying so tripped the scanner. It has failed on every
        # commit since the first one, so the job has never been green and its
        # signal was worth nothing: a real violation would have looked exactly
        # like the noise everyone had learned to ignore.
        #
        # It now matches import syntax instead of prose, and the package list
        # is the same one `tests/agent/test_compliance.py` enforces by AST —
        # which is wider than the list this step used to carry. Dynamic imports
        # are matched too, so moving a violation behind `import_module` does
        # not slip past. Python here is belt-and-braces: the AST test in the
        # backend job is the authoritative check for `src/`, and it cannot be
        # fooled by a comment in either direction. Nothing else covers `web/`.
        run: |
          set -e
          pkgs='langchain|langchain_core|langchain_community|langgraph|crewai|autogen|pyautogen|openai|anthropic|cohere|mistralai|ollama|llama_index|haystack|semantic_kernel|transformers|boto3|botocore'
          ts_pkgs='langchain|langgraph|crewai|autogen|openai|anthropic|cohere|mistralai|ollama|@anthropic-ai/|@langchain/|@aws-sdk/client-bedrock|@azure/ai'
          found=0

          # A Python import statement, not a sentence that names the library.
          if grep -rnE "^[[:space:]]*(import|from)[[:space:]]+($pkgs)([.[:space:]]|\$)" \
               --include='*.py' src/; then
            found=1
          fi

          # The same thing hidden behind a runtime import.
          if grep -rnE "(import_module|__import__)\([[:space:]]*['\"]($pkgs)" \
               --include='*.py' src/; then
            found=1
          fi

          # An ES import or require of a forbidden package in the console.
          if grep -rnE "(from|require\()[[:space:]]*['\"]($ts_pkgs)" \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               web/lib web/app web/components; then
            found=1
          fi

          if [ "$found" -ne 0 ]; then
            echo "::error::A forbidden AI SDK is imported in the source tree."
            exit 1
          fi
          echo "Clean: google-adk and google-genai only."

      # Was three greps for the header, which passed for months against a
      # LICENSE whose body had been reworded in four places — and then printed
      # that the file was stock. tests/test_license.py hashes it instead.
      #
      # The copyright holder is named on the appendix line Apache ships as
      # "Copyright [yyyy] [name of copyright owner]". That line sits after END
      # OF TERMS AND CONDITIONS, inside the boilerplate the appendix tells you
      # to copy into your own files, so filling it in changes no term — but it
      # does change the bytes. So that one line is put back to the template
      # before hashing. Reword a definition, drop a section, or edit anything
      # else, and this still fails.
      - name: Apache-2.0 licence body is unmodified
        run: |
          test -f LICENSE
          expected=cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
          actual=$(tr -d '\r' < LICENSE \
            | sed '0,/^   Copyright /s|^   Copyright .*|   Copyright [yyyy] [name of copyright owner]|' \
            | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "The LICENSE body differs from stock Apache 2.0."
            echo "  expected $expected"
            echo "  actual   $actual"
            echo "Only the appendix copyright line may carry a name. Restore the rest"
            echo "from https://www.apache.org/licenses/LICENSE-2.0.txt verbatim."
            echo "A reworded licence is undetectable to GitHub, which reports NOASSERTION."
            exit 1
          fi
          grep -q '^   Copyright [0-9]\{4\} ' LICENSE || {
            echo "The appendix copyright line names no holder."; exit 1; }
          echo "LICENSE body is stock Apache-2.0, copyright asserted."
