version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pri
      POSTGRES_USER: pri_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pri_user -d pri"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
