# Call-sheet reference data.
#
# This is deliberately NOT part of ProductionState. None of it affects a
# constraint rule, a cost or a plan — a hospital address cannot make a schedule
# illegal — so versioning it would add churn to the state chain for no gain.
# It is looked up at render time by src/pri/artifacts/call_sheet.py.

defaults:
  weather: "Hot and humid, 31C, scattered afternoon showers"
  sunrise: "06:14"
  sunset: "18:26"
  hospital: "Ernakulam General Hospital, Hospital Road, Kochi - 0484 2360002"

locations:
  LOC-01:
    address: "Chitranjali Studio Complex, Stage A, Thiruvananthapuram"
    parking: "Unit base in the north yard; crew parking off Gate 2"
    hospital: "KIMS Hospital, Anayara - 0471 3041000"
  LOC-02:
    address: "Princess Street, Fort Kochi, Ernakulam 682001"
    parking: "Basecamp at Parade Ground; no unit vehicles past the barricade"
