[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pri"
version = "0.1.0"
description = "Production Resilience Intelligence — stateful agentic digital twin for film production"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Prajwal Sutar" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "networkx>=3.3",
    "confluent-kafka>=2.4",
    "google-adk>=0.4",
    "google-genai>=0.7",
    # Durable call sheets. Without it PRI falls back to container-local disk,
    # which on Cloud Run means the audit row outlives the document.
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    "structlog>=24.2",
    "reportlab>=4.2",
    "python-dateutil>=2.9",
    # Directly imported by validator.py, candidates.py and call_sheet.py. It
    # was reaching the local virtualenv as a transitive dependency and was
    # never declared, so it was present by luck rather than by contract.
    "pyyaml>=6.0",
    # The import pipeline. Both were installed by hand during development and
    # never added here, so every container image was built without them and
    # crashed at import — `limits.py` asserts defusedxml is present, which is
    # exactly the check that caught it.
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil",
    "types-PyYAML>=6.0",
    # The importer reads workbooks with openpyxl and parses XML with
    # defusedxml. Both were being type-checked against stubs that happened to
    # be present in a local uv environment and were never declared here, so
    # `mypy src/pri` passed on a developer machine and failed in CI on every
    # commit since the repository was created. Declared, not silenced: an
    # ignore_missing_imports override would have turned seven real errors into
    # seven unchecked modules.
    "types-defusedxml",
    "types-openpyxl",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pri"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "RUF", # ruff-specific
]
ignore = [
    "ANN401", # typing.Any in signatures — allowed outside domain/engine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

# Pydantic and FastAPI resolve annotations at runtime to build validators and
# request schemas, so their models cannot have their field types hidden behind
# `if TYPE_CHECKING`. Without this, TC001/TC003 would "fix" the API layer into
# a pile of NameErrors at import.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

# ---------------------------------------------------------------------------
# Mypy — strict on domain + engine, lenient elsewhere
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["tests/", "ibm/"]

[[tool.mypy.overrides]]
module = ["pri.domain.*", "pri.engine.*"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "networkx.*",
    "reportlab.*",
    "google.cloud.*",
    "google.adk.*",
    "google.genai.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a live cloud dependency (Confluent, Vertex). Skipped in CI, not failed.",
]
